name: Gerar APK Conecta & Vence V78

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar e extrair V78
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Conecta_Vence_V78*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP da V78 não encontrado."
            exit 1
          fi

          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d projeto

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto Android: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Vence-V78-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
