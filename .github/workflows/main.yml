name: Conecta Vence - Gerar APK V82

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar V82
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'Conecta_Vence_V82*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "V82 não encontrada."
            exit 1
          fi

          echo "Usando: $ZIP"
          rm -rf projeto
          mkdir projeto
          unzip -q "$ZIP" -d projeto

      - name: Encontrar projeto Android
        shell: bash
        run: |
          FILE=$(find projeto -type f \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          | head -1)

          if [ -z "$FILE" ]; then
            echo
